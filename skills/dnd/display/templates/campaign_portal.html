<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D&D Campaign</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background:#0b1117; color:#f2e5c8; }
    * { box-sizing:border-box; }
    body { margin:0; height:100dvh; overflow:hidden; }
    button, input, select, textarea { font:inherit; }
    button { border:1px solid #b28d4e; border-radius:7px; padding:11px 16px; background:#d8b675; color:#1d170f; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    button.secondary { background:transparent; color:#ead7ae; border-color:#685333; }
    :focus-visible { outline:3px solid #edcf87; outline-offset:3px; }
    #display { display:block; width:100%; height:100%; border:0; background:#0b1117; }
    #campaign-menu { position:fixed; z-index:2; top:14px; right:16px; display:flex; align-items:center; gap:12px; max-width:calc(100% - 32px); padding:6px 8px 6px 15px; border:1px solid #685333; border-radius:10px; background:rgba(13,15,17,.94); box-shadow:0 4px 20px #0006; }
    #session-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:#d5c9b2; }
    #open-campaign { padding:7px 11px; font-size:13px; white-space:nowrap; }
    dialog { width:min(560px, calc(100vw - 32px)); max-height:calc(100dvh - 40px); margin:auto; padding:0; border:1px solid #80643c; border-radius:15px; background:#171a1e; color:#f2e5c8; box-shadow:0 25px 100px #000a; }
    dialog::backdrop { background:rgba(3,7,12,.78); backdrop-filter:blur(6px); }
    .dialog-body { padding:28px; }
    .heading { display:flex; gap:14px; align-items:center; padding-right:24px; }
    .heading img { width:44px; height:44px; }
    h1 { margin:0; font-size:24px; font-weight:600; }
    .intro { margin:16px 0 22px; color:#bdb7ac; font-size:14px; line-height:1.5; }
    #close-campaign { position:absolute; right:12px; top:12px; padding:4px 9px; font-size:22px; border:0; background:transparent; color:#c7bba4; }
    label { display:block; margin:16px 0 7px; color:#d2c3a9; font-size:13px; }
    input, select, textarea { display:block; width:100%; padding:11px 12px; border:1px solid #514b40; border-radius:7px; background:#0e1217; color:#f2e5c8; }
    textarea { min-height:90px; resize:vertical; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:10px; margin-top:22px; }
    #continue { margin-right:auto; }
    #status { margin:16px 0 0; min-height:1.5em; color:#d6d8b2; font-size:14px; line-height:1.5; }
    #status.error { color:#ffb2a7; }
    details { margin-top:18px; border-top:1px solid #38362f; padding-top:12px; color:#a69f94; font-size:12px; }
    summary { cursor:pointer; }
    #terminal { margin:12px 0 0; max-height:180px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font:11px/1.5 ui-monospace, monospace; color:#c5c1b9; }
    [hidden] { display:none !important; }
    @media (max-width:520px) { .dialog-body { padding:23px 20px; } .grid { grid-template-columns:1fr; gap:0; } #session-label { max-width:44vw; } }
  </style>
</head>
<body>
  <iframe id="display" src="http://127.0.0.1:5001/?style=illustrated-vellum" title="D&D cinematic display" allow="autoplay; fullscreen"></iframe>
  <nav id="campaign-menu" aria-label="Campaign controls">
    <span id="session-label">Your next adventure</span>
    <button id="open-campaign" class="secondary" type="button">Campaign &amp; model</button>
  </nav>
  <dialog id="campaign-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-body">
      <button id="close-campaign" type="button" aria-label="Return to the display">×</button>
      <div class="heading"><img src="/icon.png" alt=""><h1 id="dialog-title">Choose your adventure</h1></div>
      <p class="intro" id="dialog-description">Start a new story, return to a saved campaign, or choose a different Dungeon Master.</p>
      <form id="campaign-form">
        <div class="grid">
          <div><label for="mode">Campaign</label><select id="mode"><option value="new">New campaign</option><option value="resume">Load campaign</option></select></div>
          <div><label for="provider">Dungeon Master</label><select id="provider"><option value="qwen">Qwen · local</option><option id="codex-option" value="codex">Codex</option><option value="claude">Claude</option></select></div>
        </div>
        <div id="new-fields"><label for="name">Campaign name · optional</label><input id="name" maxlength="60" placeholder="Name your adventure" autocomplete="off"></div>
        <div id="resume-fields" hidden><label for="saved">Saved campaign</label><select id="saved"></select></div>
        <label for="description" id="description-label">What kind of adventure?</label>
        <textarea id="description" maxlength="3000" placeholder="Mountains, friendly dragons, and a missing golden diamond…"></textarea>
        <div class="actions"><button id="continue" class="secondary" type="button" hidden>Continue current campaign</button><button id="start" type="submit" disabled>Start campaign</button></div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <details><summary>DM console</summary><pre id="terminal">No model session is running.</pre></details>
    </div>
  </dialog>
  <script>
    const token = {{ token|tojson }};
    const $ = id => document.getElementById(id);
    const dialog = $('campaign-dialog');
    const api = async (path, method='GET', body) => {
      const response = await fetch(path, {method, headers:{'X-DND-Portal-Token':token, 'Content-Type':'application/json'}, body:body ? JSON.stringify(body) : undefined});
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || data.error || 'Request failed');
      return data;
    };
    let state = null;
    let initialized = false;
    let busy = false;
    let switching = false;
    let refreshing = false;
    const providerNames = {qwen:'Qwen', codex:'Codex', claude:'Claude'};
    const message = (text, error=false) => { $('status').textContent=text; $('status').classList.toggle('error', error); };
    const selectedName = () => $('mode').value === 'new' ? $('name').value.trim() : $('saved').value;
    const continuing = () => state && state.active && $('mode').value === 'resume' && selectedName() === state.meta.campaign && $('provider').value === state.meta.provider;
    function updateControls() {
      const resume = $('mode').value === 'resume';
      $('new-fields').hidden = resume;
      $('resume-fields').hidden = !resume;
      $('description-label').textContent = resume ? 'Anything to tell your DM? · optional' : 'What kind of adventure?';
      $('description').placeholder = resume ? 'A note for the next part of your adventure…' : 'Mountains, friendly dragons, and a missing golden diamond…';
      $('continue').hidden = !(state && state.active) || continuing();
      $('continue').disabled = busy;
      $('close-campaign').disabled = busy;
      for (const id of ['mode', 'provider', 'name', 'saved', 'description']) $(id).disabled = busy;
      $('start').disabled = busy || !state || (resume && !selectedName());
      $('start').textContent = continuing() ? 'Continue campaign' : state && state.active ? 'Save & switch' : resume ? 'Load campaign' : 'Start campaign';
    }
    function closeDialog() {
      if (busy) return;
      dialog.close();
      $('open-campaign').focus();
    }
    function enterCampaign() {
      $('display').src = 'http://127.0.0.1:5001/?style=illustrated-vellum&audio=on';
      closeDialog();
    }
    function showDialog() {
      if (!dialog.open) dialog.showModal();
      refresh();
    }
    function updateState(data) {
      state = {...data, meta:data.meta || {}};
      $('codex-option').disabled = !data.codex_enabled;
      $('codex-option').textContent = data.codex_enabled ? 'Codex' : 'Codex · unavailable';
      const oldValue = $('saved').value;
      const names = [...data.campaigns];
      if (state.active && state.meta.campaign && !names.includes(state.meta.campaign)) names.unshift(state.meta.campaign);
      const shownNames = Array.from($('saved').options, option => option.value);
      if (shownNames.join('\0') !== names.join('\0')) $('saved').replaceChildren(...names.map(name => new Option(name, name)));
      if (names.includes(oldValue)) $('saved').value=oldValue;
      if (!initialized) {
        if (state.active) {
          $('mode').value='resume';
          $('saved').value=state.meta.campaign;
          if (providerNames[state.meta.provider]) $('provider').value=state.meta.provider;
        } else if (names.length) $('mode').value='resume';
        initialized=true;
      }
      $('session-label').textContent = state.active ? (state.meta.campaign || 'Adventure') + ' · ' + (providerNames[state.meta.provider] || 'DM') : 'Choose an adventure';
      const terminal = $('terminal');
      const output = state.active ? data.output || 'Your DM is starting…' : 'No model session is running.';
      if (terminal.textContent !== output) terminal.textContent = output;
      const handoff = data.handoff || {};
      if (handoff.status === 'saving' || handoff.status === 'starting') {
        switching=true;
        busy=true;
      }
      if (switching) {
        if (handoff.status === 'failed') {
          switching=false;
          busy=false;
          message(handoff.message || 'The switch could not finish. You can try again.', true);
        } else if (handoff.status === 'complete') {
          switching=false;
          busy=false;
          message(handoff.message || 'Your campaign is ready.');
          enterCampaign();
        } else message(handoff.message || 'Saving your campaign before switching…');
      }
      updateControls();
    }
    async function refresh() {
      if (refreshing) return;
      refreshing=true;
      try { updateState(await api('/api/state')); }
      catch (error) { message(error.message, true); }
      finally { refreshing=false; }
    }
    $('campaign-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (busy || !state) return;
      if (continuing()) { enterCampaign(); return; }
      busy=true;
      updateControls();
      message(state.active ? 'Saving your campaign before switching…' : 'Getting your adventure ready…');
      try {
        const payload = {provider:$('provider').value, mode:$('mode').value, name:selectedName(), description:$('description').value};
        if (state.active) {
          const data = await api('/api/switch', 'POST', payload);
          switching=true;
          message(data.message || 'Saving your campaign before switching…');
        } else {
          const data = await api('/api/start', 'POST', payload);
          busy=false;
          message(data.message || 'Your adventure is ready.');
          enterCampaign();
        }
        await refresh();
      } catch (error) { busy=false; switching=false; message(error.message, true); updateControls(); }
    });
    $('continue').addEventListener('click', enterCampaign);
    $('open-campaign').addEventListener('click', showDialog);
    $('close-campaign').addEventListener('click', closeDialog);
    dialog.addEventListener('cancel', event => { if (busy) event.preventDefault(); });
    dialog.addEventListener('close', () => $('open-campaign').focus());
    for (const id of ['mode', 'provider', 'name', 'saved']) $(id).addEventListener('change', updateControls);
    dialog.showModal();
    refresh();
    setInterval(refresh, 1200);
  </script>
</body>
</html>
